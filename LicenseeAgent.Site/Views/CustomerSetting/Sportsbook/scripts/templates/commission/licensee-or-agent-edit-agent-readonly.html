<div class="comm-group">
    <div class="comm-header">
        <span>{{commissionSetting.name}}</span>
    </div>
    <div class="comm-content">
        <input type="text" ng-model="commissionSetting.discount" maxlength="{{config.maxInput}}"
            ng-change="commissionSetting.actions.onChangeDiscountValue()" class="input value-input"
            readonly="readonly" />
        <span>[{{commissionSetting.minDiscount}} - {{commissionSetting.maxDiscount}}]</span>
    </div>
</div>
