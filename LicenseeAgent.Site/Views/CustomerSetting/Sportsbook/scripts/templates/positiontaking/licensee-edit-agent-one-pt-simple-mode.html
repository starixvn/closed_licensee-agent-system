<div class="pt-group">
    <div class="pt-header-box">
        <div class="pt-header">
            <span>{{language.maxPt}}</span>
        </div>
        <div class="pt-header">
            <span>{{language.minPt}}</span>
        </div>
    </div>
    <div class="pt-content-box">
        <div class="pt-content">
            <input class="max-input" type="text" maxlength="{{config.maxInput}}" data-ng-model="ptSimple.Max"
                data-ng-change="ptSimple.actions.onChangeMax()" data-ng-blur="ptSimple.actions.onBlurMax()" />
            <span>[{{ptSimple.MinRangeOfMax | number:config.decNumber}} - {{ptSimple.MaxRangeOfMax
                | number:config.decNumber}}] </span>
        </div>
        <div class="pt-content">
            <input class="min-input" type="text" maxlength="{{config.maxInput}}" data-ng-model="ptSimple.Min"
                data-ng-change="ptSimple.actions.onChangeMin()" />
            <span>[{{ptSimple.MinRangeOfMin | number:config.decNumber}} - {{ptSimple.MaxRangeOfMin
                | number:config.decNumber}}] </span>
        </div>
    </div>
</div>
