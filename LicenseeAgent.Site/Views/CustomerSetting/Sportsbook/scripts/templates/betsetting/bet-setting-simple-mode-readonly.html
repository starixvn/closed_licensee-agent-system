<div>
    <div class="betting-limit-item">
        <input type="text" class="input" data-ng-model="modelData.MinBet" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"modelData.actions.onChangeMinBet()"}' readonly="readonly" />
        <span data-ng-show="modelData.MaxMinBet > 0">&gt;= {{modelData.MaxMinBet | number : 0}}</span>
    </div>
    <div class="betting-limit-item">
        <input type="text" class="input" data-ng-model="modelData.MaxBet" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"modelData.actions.onChangeMaxBet()"}' readonly="readonly" />
        <span data-ng-show="modelData.MinMaxBet > 0">&lt;= {{modelData.MinMaxBet | number : 0}}</span>
    </div>
    <div class="betting-limit-item">
        <input type="text" class="input" data-ng-model="modelData.MaxPerMatch" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"modelData.actions.onChangeMaxPerMatch()"}' readonly="readonly" />
        <span data-ng-show="modelData.MinMaxPerMatch > 0">&lt;= {{modelData.MinMaxPerMatch | number
            : 0}}</span>
    </div>
</div>
