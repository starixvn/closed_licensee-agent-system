<div>
    <div class="betting-limit-header row-title">
        <div class="betting-limit-inner-header">
            <span>{{betSetting.sportTypeName}}</span>
        </div>
    </div>
    <div class="betting-limit-item">
        <div class="betting-limit-inner-item">
            <input type="text" class="input" ng-model="betSetting.MinBet" maxlength="{{config.maxInput}}"
                auto-numeric-format='{"command":"modelData.actions.onChangeMinBet()"}' readonly="readonly" />
            <span ng-show="betSetting.MaxMinBet > 0">&gt;= {{betSetting.MaxMinBet | number : 0}} </span>
        </div>
    </div>
    <div class="betting-limit-item">
        <div class="betting-limit-inner-item">
            <input type="text" class="input" ng-model="betSetting.MaxBet" maxlength="{{config.maxInput}}"
                auto-numeric-format='{"command":"modelData.actions.onChangeMaxBet()"}' readonly="readonly" />
            <span ng-show="betSetting.MinMaxBet > 0">&lt;= {{betSetting.MinMaxBet | number : 0}} </span>
        </div>
    </div>
    <div class="betting-limit-item">
        <div class="betting-limit-inner-item">
            <input type="text" class="input" ng-model="betSetting.MaxPerMatch" maxlength="{{config.maxInput}}"
                auto-numeric-format='{"command":"modelData.actions.onChangeMaxPerMatch()"}' readonly="readonly" />
            <span ng-show="betSetting.MinMaxPerMatch > 0">&lt;= {{betSetting.MinMaxPerMatch | number : 0}} </span>
        </div>
    </div>
</div>
