<div>
    <div data-ng-if="$index % config.breakNewLine == 0" class="pt-header-box">
        <div class="pt-header-bettype" data-html="true">
        </div>
        <div class="pt-header">
            <span>{{languageService.getString('OnMember')}}</span>
        </div>
    </div>
    <div class="pt-content-box">
        <div class="pt-content-bettype" data-html="true" id="copy_sport_{{pt.SportId}}_bettype_{{pt.BetTypeId}}">
            <span>{{languageService.getBetTypeName(pt.BetTypeId)}}</span> <span data-ng-if="$index % config.breakNewLine == 0 && ptGroup.PositionTakings.length > 1"
                class="icon-setting-copy" data-ng-click="positionTakingService.copyPartial(pt, ptGroup, config.breakNewLine)"
                title="{{$index==0 ? languageService.getString('SoccerHandicapCopyPtTooltip') : languageService.getString('SoccerOnexTwoCopyPtTooltip')}}">
            </span>
        </div>
        <div class="pt-content">
            <input class="value-input" type="text" maxlength="{{config.maxInput}}" data-ng-model="pt.Value"
                auto-numeric-format='{"mDec":"2","command":"pt.actions.onChangeValue()"}' />
            <span>[{{pt.MinRangeOfValue | number:config.decNumber}} - {{pt.MaxRangeOfValue | number:config.decNumber}}]</span>
        </div>
    </div>
</div>
