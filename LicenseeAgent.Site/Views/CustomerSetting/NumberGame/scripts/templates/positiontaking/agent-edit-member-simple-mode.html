<div class="pt-group">
    <div class="pt-header-box">
        <div class="pt-header">
            <span>{{language.memberPt}}</span>
        </div>
    </div>
    <div class="pt-content-box">
        <div class="pt-content">
            <input class="value-input" type="text" maxlength="{{config.maxInput}}" data-ng-model="ptSimple.Value"
                auto-numeric-format='{"mDec":"2","command":"ptSimple.actions.onChangeValue()"}' />
            <span>[{{ptSimple.MinRangeOfValue | number:config.decNumber}} - {{ptSimple.MaxRangeOfValue
                | number:config.decNumber}}]</span>
        </div>
    </div>
</div>
