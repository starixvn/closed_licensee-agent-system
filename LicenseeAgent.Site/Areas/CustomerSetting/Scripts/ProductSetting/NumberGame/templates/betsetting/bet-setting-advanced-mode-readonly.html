<div>
    <div class="betting-limit-item-col4 min-bet advanced-mode">
        <input type="text" class="input" data-ng-model="betSetting.MinBet" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"betSetting.actions.onChangeMinBet()"}' readonly="readonly" />
        <span data-ng-show="betSetting.MaxMinBet > 0">&gt;= {{betSetting.MaxMinBet | number : 0}}
        </span>
    </div>
    <div class="betting-limit-item-col4 advanced-mode">
        <input type="text" class="input" data-ng-model="betSetting.MaxBet" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"betSetting.actions.onChangeMaxBet()"}' readonly="readonly" />
        <span data-ng-show="betSetting.MinMaxBet > 0">&lt;= {{betSetting.MinMaxBet | number : 0}}
        </span>
    </div>
    <div class="betting-limit-item-col4 advanced-mode">
        <input type="text" class="input" data-ng-model="betSetting.MaxPerMatch" maxlength="{{config.maxInput}}"
               auto-numeric-format='{"command":"betSetting.actions.onChangeMaxPerMatch()"}' readonly="readonly" />
        <span data-ng-show="betSetting.MinMaxPerMatch > 0">&lt;= {{betSetting.MinMaxPerMatch | number
            : 0}} </span>
    </div>
    <div class="betting-limit-item-col4 advanced-mode">
        <input type="text" class="input" data-ng-model="betSetting.MaxPerBall" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"betSetting.actions.onChangeMaxPerBall()"}' readonly="readonly" />
        <span data-ng-show="betSetting.MinMaxPerBall > 0">&lt;= {{betSetting.MinMaxPerBall | number
            : 0}}</span>
    </div>
</div>
