<div>
    <div class="pt-header-simple">
        <div class="pt-box-header-simple">
            <span class="pt-box-header-text-simple">{{language.maxPt}}</span>
        </div>
        <div class="pt-box-header-simple">
            <span class="pt-box-header-text-simple">{{language.minPt}}</span>
        </div>
    </div>
    <div class="pt-simple">
        <div class="pt-box-simple">
            <input class="max-input" type="text" maxlength="{{config.maxInput}}" ng-model="ptSimple.Max"
                ng-change="ptSimple.actions.onChangeMax()" ng-blur="ptSimple.actions.onBlurMax()" />
            <div class="range">[{{ptSimple.MinRangeOfMax | number:config.decNumber}} - {{ptSimple.MaxRangeOfMax
                | number:config.decNumber}}]</div>
        </div>
        <div class="pt-box-simple">
            <input class="min-input" type="text" maxlength="{{config.maxInput}}" ng-model="ptSimple.Min"
                ng-change="ptSimple.actions.onChangeMin()" />
            <div class="range">[{{ptSimple.MinRangeOfMin | number:config.decNumber}} - {{ptSimple.MaxRangeOfMin
                | number:config.decNumber}}]</div>
        </div>
    </div>
</div>
