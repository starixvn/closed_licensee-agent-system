<div>
    <div class="betting-limit-item-col4">
        <input type="text" class="input" ng-model="modelData.MinBet" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"modelData.actions.onChangeMinBet()"}' readonly="readonly" />
        <span ng-show="modelData.MaxMinBet > 0">&gt;= {{modelData.MaxMinBet | number : 0}}</span>
    </div>
    <div class="betting-limit-item-col4">
        <input type="text" class="input" ng-model="modelData.MaxBet" maxlength="{{config.maxInput}}"
            auto-numeric-format='{"command":"modelData.actions.onChangeMaxBet()"}' readonly="readonly" />
        <span ng-show="modelData.MinMaxBet > 0">&lt;= {{modelData.MinMaxBet | number : 0}}</span>
    </div>
    <div class="betting-limit-item-col4">
        <input type="text" class="input" ng-model="modelData.MaxPerMatch" maxlength="{{config.maxInput}}"
               auto-numeric-format='{"command":"modelData.actions.onChangeMaxPerMatch()"}' readonly="readonly" />
        <span ng-show="modelData.MinMaxPerMatch > 0">&lt;= {{modelData.MinMaxPerMatch | number
            : 0}}</span>
    </div>
    <div class="betting-limit-item-col4">
        <input type="text" class="input" ng-model="modelData.MaxPerBall" maxlength="{{config.maxInput}}"
               auto-numeric-format='{"command":"modelData.actions.onChangeMaxPerBall()"}' readonly="readonly" />
        <span ng-show="modelData.MinMaxPerBall > 0">&lt;= {{modelData.MinMaxPerBall | number
            : 0}}</span>
    </div>
</div>
