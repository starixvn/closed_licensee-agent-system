<div>
    <div ng-if="$index % config.breakNewLine == 0" class="pt-header">
        <div class="pt-box-title" data-html="true">
        </div>
        <div class="pt-box-header">
            <span class="pt-box-header-text">{{language.maxPt}}</span>
        </div>
        <div class="pt-box-header">
            <span class="pt-box-header-text">{{language.minPt}}</span>
        </div>
    </div>
    <div class="pt">
        <div class="pt-box-title" data-html="true" id="copy_sport_{{pt.SportId}}_bettype_{{pt.BetTypeId}}">
            <span class="bettype-name">{{language["bettype_" + pt.BetTypeId]}}</span> <span ng-if="$index % config.breakNewLine == 0 && ptGroup.PositionTakings.length > 1"
                class="icon-setting-copy" ng-click="positionTakingService.copyPartial(pt, ptGroup, config.breakNewLine)"
                title="{{$index==0 ? language.soccerHandicapCopyPtTooltip : language.soccerOnexTwoCopyPtTooltip}}">
            </span>
        </div>
        <div class="pt-box">
            <input class="max-input" type="text" maxlength="{{config.maxInput}}" ng-model="pt.Max"
                ng-change="pt.actions.onChangeMax()" ng-blur="pt.actions.onBlurMax()" />
            <div class="range">[{{pt.MinRangeOfMax | number:config.decNumber}} - {{pt.MaxRangeOfMax | number:config.decNumber}}]</div>
        </div>
        <div class="pt-box">
            <input class="min-input" type="text" maxlength="{{config.maxInput}}" ng-model="pt.Min"
                ng-change="pt.actions.onChangeMin()" />
            <div class="range">[{{pt.MinRangeOfMin | number:config.decNumber}} - {{pt.MaxRangeOfMin | number:config.decNumber}}]</div>
        </div>
    </div>
</div>
